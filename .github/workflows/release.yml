name: Release

# Publishing a GitHub release with the tag v<version> uploads that version to Maven Central.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 18 or later: javadoc ignores @SuppressWarnings("doclint:missing") before that.
          java-version: 21
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Check that the tag matches the version in pom.xml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(./mvnw -q -ntp -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pom.xml version $version (expected v$version)"
            exit 1
          fi
      - name: Deploy to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Prelease deploy
