name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The JVM that runs the tests. The jar targets Java 8, so 8 must stay in this list.
        java: [8, 11, 17, 21]
    steps:
      - uses: actions/checkout@v7
      - name: Install the JDK that runs the tests
        id: test-jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # The build needs JDK 9 or later to compile for Java 8 with the "release" option.
      - name: Install the JDK that runs the build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp verify "-Djvm=${{ steps.test-jdk.outputs.path }}/bin/java"
